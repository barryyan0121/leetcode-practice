name: Python LeetCode Tests

on:
  push:
    branches: [master]

  workflow_dispatch: # 允许手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Static Check (Test Structure)
        run: python check_python_tests.py
        continue-on-error: true

      - name: Run LeetCode Tests
        run: |
          mapfile -d '' files < <(git diff --name-only -z HEAD^ HEAD -- 'solution/python/*.py')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Python solution files changed; skipping solution tests."
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Running tests in $file"
            python "$file"
          done
        shell: bash
